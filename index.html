    position: relative; height: 132px; border-radius: var(--radius);

const reel = document.getElementById('reel');
const go = document.getElementById('go');
const result = document.getElementById('result');
const overlay = document.getElementById('overlay');
const SLOT_H = 44;
let spinning = false;
let spinCount = 0;

/* remember if user already subscribed/dismissed (safe if storage blocked) */
function store(key, val) { try { localStorage.setItem(key, val); } catch(e){} }
function read(key) { try { return localStorage.getItem(key); } catch(e){ return null; } }
let emailDone = read('hr_email') === 'done';

document.querySelectorAll('.row').forEach(row => {
  const group = row.dataset.group;
  row.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      row.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state[group] = chip.dataset.val;
    });
  });
});

function matches(a) {
  return (state.who === "any" || a.who === "any" || a.who === state.who)
      && (state.where === "any" || a.where === "any" || a.where === state.where)
      && (state.vibe === "any" || a.vibe === "any" || a.vibe === state.vibe);
}
function slotHTML(a) { return `<div class="slot"><span class="emoji">${a.e}</span>${a.t}</div>`; }

function spin() {
  if (spinning) return;

  // hard gate: block once trigger reached and not subscribed
  if (HARD_GATE && !emailDone && spinCount >= SPIN_TRIGGER) { openModal(); return; }

  const pool = ACTIVITIES.filter(matches);
  if (pool.length === 0) { result.innerHTML = "No match — loosen a filter and try again."; return; }

  spinning = true; go.disabled = true; result.textContent = "Rolling…";
  spinCount++;
  gtag('event', 'spin', { spin_number: spinCount });   // <-- analytics event

  const pick = pool[Math.floor(Math.random() * pool.length)];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    reel.style.transition = "none";
    reel.innerHTML = slotHTML(pick);
    reel.style.transform = `translateY(${(132 - SLOT_H)/2}px)`;
    finish(pick); return;
  }

  const strip = [];
  for (let i = 0; i < 34; i++) strip.push(ACTIVITIES[Math.floor(Math.random()*ACTIVITIES.length)]);
  strip.push(pick);
  reel.innerHTML = strip.map(slotHTML).join('');

  const y = -((strip.length - 1) * SLOT_H) + (132 - SLOT_H) / 2;
  reel.style.transition = "none";
  reel.style.transform = "translateY(0px)";
  reel.getBoundingClientRect();
  reel.style.transition = "transform 2.6s cubic-bezier(0.15, 0.9, 0.2, 1)";
  reel.style.transform = `translateY(${y}px)`;
  reel.addEventListener('transitionend', () => finish(pick), { once: true });
}

function finish(pick) {
  spinning = false; go.disabled = false; go.textContent = "Spin again";
  result.innerHTML = `Go do it: <strong>${pick.t}</strong> ${pick.e}`;
  // soft prompt: after trigger, once, if not already done
  if (!HARD_GATE && !emailDone && spinCount === SPIN_TRIGGER) openModal();
}

/* ---- modal logic ---- */
function openModal() {
  overlay.classList.add('show');
  gtag('event', 'email_prompt_shown');
}
function closeModal() { overlay.classList.remove('show'); }

document.getElementById('modalX').addEventListener('click', closeModal);
document.getElementById('skipEmail').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

document.getElementById('submitEmail').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  if (!email || !email.includes('@')) { document.getElementById('email').focus(); return; }
  try {
    await fetch(FORMSPREE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email })
    });
  } catch(e) {}
  emailDone = true; store('hr_email', 'done');
  gtag('event', 'email_captured');
  document.getElementById('modalForm').style.display = 'none';
  document.getElementById('modalThanks').style.display = 'block';
  setTimeout(closeModal, 1800);
});

go.addEventListener('click', spin);
</script>
</body>
</html>
