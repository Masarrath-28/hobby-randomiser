<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>What Should I Do? — Boredom Buster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --night: #17123a;
    --night-2: #221a52;
    --panel: #2b2166;
    --pop: #ffd23f;   /* game-show gold */
    --coral: #ff6b6b;
    --mint: #4ecdc4;
    --ink: #f6f4ff;
    --muted: #a79fd6;
    --radius: 22px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 80% -10%, #3a2a8c 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 110%, #5b2a6b 0%, transparent 55%),
      var(--night);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 18px;
  }

  .card {
    width: 100%;
    max-width: 480px;
  }

  header { text-align: center; margin-bottom: 22px; }

  .eyebrow {
    font-family: 'Fredoka', sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--pop);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 8vw, 44px);
    line-height: 1.02;
    margin: 0;
  }
  h1 .curl { color: var(--coral); }

  /* ---- filter chips ---- */
  .filters {
    display: grid;
    gap: 12px;
    margin: 22px 0;
  }
  .row { display: flex; gap: 8px; }
  .chip {
    flex: 1;
    border: 1.5px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.04);
    color: var(--muted);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 6px;
    border-radius: 14px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .chip:hover { border-color: rgba(255,255,255,0.3); color: var(--ink); }
  .chip.active {
    background: var(--pop);
    color: #2a1e00;
    border-color: var(--pop);
  }
  .chip:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }

  /* ---- reel window ---- */
  .window {
    position: relative;
    height: 132px;
    border-radius: var(--radius);
    background: linear-gradient(180deg, var(--night-2), var(--panel));
    border: 1.5px solid rgba(255,255,255,0.1);
    overflow: hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
  }
  .window::before, .window::after {
    content: ""; position: absolute; left: 0; right: 0; height: 44px; z-index: 3; pointer-events: none;
  }
  .window::before { top: 0; background: linear-gradient(var(--night-2), transparent); }
  .window::after { bottom: 0; background: linear-gradient(transparent, var(--panel)); }

  .marker {
    position: absolute; left: 0; right: 0; top: 50%; height: 44px; transform: translateY(-50%);
    border-top: 1.5px solid var(--pop); border-bottom: 1.5px solid var(--pop);
    z-index: 2; pointer-events: none;
  }

  .reel { position: absolute; left: 0; right: 0; top: 0; }
  .slot {
    height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px;
    font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; padding: 0 16px; text-align: center;
  }
  .slot .emoji { font-size: 20px; }

  /* ---- result ---- */
  .result {
    text-align: center;
    min-height: 44px;
    margin: 16px 4px 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .result strong { color: var(--mint); }

  /* ---- button ---- */
  .go {
    width: 100%;
    border: none;
    cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: .5px;
    color: #2a1e00;
    background: var(--pop);
    padding: 18px;
    border-radius: 18px;
    box-shadow: 0 6px 0 #c9a400, 0 12px 24px rgba(255,210,63,0.25);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .go:hover { transform: translateY(-1px); }
  .go:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9a400; }
  .go:disabled { opacity: .6; cursor: default; box-shadow: 0 6px 0 #c9a400; transform: none; }
  .go:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }

  footer { text-align: center; margin-top: 18px; color: var(--muted); font-size: 12px; }

  @media (prefers-reduced-motion: reduce) {
    .reel { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <header>
      <p class="eyebrow">Bored? Roll for it.</p>
      <h1>What Should<br>I <span class="curl">Do?</span></h1>
    </header>

    <div class="filters">
      <div class="row" data-group="who">
        <button class="chip active" data-val="any">Anyone</button>
        <button class="chip" data-val="solo">Solo</button>
        <button class="chip" data-val="group">Friends</button>
      </div>
      <div class="row" data-group="where">
        <button class="chip active" data-val="any">Anywhere</button>
        <button class="chip" data-val="indoor">Indoors</button>
        <button class="chip" data-val="outdoor">Outdoors</button>
      </div>
      <div class="row" data-group="vibe">
        <button class="chip active" data-val="any">Any vibe</button>
        <button class="chip" data-val="chill">Chill</button>
        <button class="chip" data-val="active">Active</button>
      </div>
    </div>

    <div class="window" aria-hidden="true">
      <div class="marker"></div>
      <div class="reel" id="reel"></div>
    </div>

    <p class="result" id="result" aria-live="polite">Pick your filters, then spin.</p>

    <button class="go" id="go">Randomise</button>

    <footer>40+ ideas · no signup · just go do it</footer>
  </main>

<script>
const ACTIVITIES = [
  {e:"🎸",t:"Learn 3 guitar chords",who:"solo",where:"indoor",vibe:"chill"},
  {e:"✏️",t:"Speed-sketch your desk",who:"solo",where:"indoor",vibe:"chill"},
  {e:"🍳",t:"Cook a random country's dish",who:"any",where:"indoor",vibe:"chill"},
  {e:"📷",t:"Go on a photo walk",who:"any",where:"outdoor",vibe:"active"},
  {e:"✈️",t:"Build a paper airplane fleet",who:"any",where:"indoor",vibe:"chill"},
  {e:"🧹",t:"20-minute declutter sprint",who:"solo",where:"indoor",vibe:"active"},
  {e:"🦢",t:"Try origami from a video",who:"solo",where:"indoor",vibe:"chill"},
  {e:"🕺",t:"Have a mini dance battle",who:"group",where:"indoor",vibe:"active"},
  {e:"🎲",t:"Play a board game",who:"group",where:"indoor",vibe:"chill"},
  {e:"👅",t:"Do a blind taste test",who:"group",where:"indoor",vibe:"chill"},
  {e:"📍",t:"Go geocaching nearby",who:"group",where:"outdoor",vibe:"active"},
  {e:"✍️",t:"Write a 6-word story each",who:"any",where:"indoor",vibe:"chill"},
  {e:"🃏",t:"Learn a card trick",who:"solo",where:"indoor",vibe:"chill"},
  {e:"💪",t:"Home workout circuit",who:"solo",where:"indoor",vibe:"active"},
  {e:"🌟",t:"Go stargazing",who:"any",where:"outdoor",vibe:"chill"},
  {e:"🧑‍🍳",t:"Mystery-ingredient cook-off",who:"group",where:"indoor",vibe:"active"},
  {e:"🖼️",t:"Sketch each other's portraits",who:"group",where:"indoor",vibe:"chill"},
  {e:"☕",t:"Try a new coffee recipe",who:"solo",where:"indoor",vibe:"chill"},
  {e:"🔎",t:"Neighborhood scavenger hunt",who:"group",where:"outdoor",vibe:"active"},
  {e:"🌿",t:"Start a tiny herb garden",who:"solo",where:"outdoor",vibe:"chill"},
  {e:"🎤",t:"Karaoke session",who:"group",where:"indoor",vibe:"active"},
  {e:"🧩",t:"Solve a jigsaw puzzle",who:"any",where:"indoor",vibe:"chill"},
  {e:"🗣️",t:"Learn 5 phrases in a new language",who:"solo",where:"indoor",vibe:"chill"},
  {e:"🥏",t:"Play frisbee in the park",who:"group",where:"outdoor",vibe:"active"},
  {e:"🔐",t:"DIY escape-room challenge",who:"group",where:"indoor",vibe:"chill"},
  {e:"🍪",t:"Bake cookies",who:"any",where:"indoor",vibe:"chill"},
  {e:"🧘",t:"Try a 10-minute meditation",who:"solo",where:"indoor",vibe:"chill"},
  {e:"🚲",t:"Bike somewhere new",who:"any",where:"outdoor",vibe:"active"},
  {e:"🗼",t:"Build the tallest junk tower",who:"group",where:"indoor",vibe:"active"},
  {e:"🎬",t:"Themed movie marathon",who:"group",where:"indoor",vibe:"chill"},
  {e:"🤹",t:"Learn to juggle",who:"solo",where:"indoor",vibe:"active"},
  {e:"💌",t:"Write postcards to friends",who:"solo",where:"indoor",vibe:"chill"},
  {e:"🍃",t:"Nature walk + collect leaves",who:"any",where:"outdoor",vibe:"chill"},
  {e:"🎭",t:"Play charades",who:"group",where:"indoor",vibe:"active"},
  {e:"🖋️",t:"Try hand lettering",who:"solo",where:"indoor",vibe:"chill"},
  {e:"⏱️",t:"Two-minute plank contest",who:"group",where:"indoor",vibe:"active"},
  {e:"🎧",t:"Make a mood playlist",who:"solo",where:"indoor",vibe:"chill"},
  {e:"🛍️",t:"Explore a local market",who:"any",where:"outdoor",vibe:"chill"},
  {e:"🏁",t:"Race to finish a puzzle",who:"group",where:"indoor",vibe:"active"},
  {e:"🪙",t:"Learn a coin trick",who:"solo",where:"indoor",vibe:"chill"},
];

const state = { who:"any", where:"any", vibe:"any" };
const reel = document.getElementById('reel');
const go = document.getElementById('go');
const result = document.getElementById('result');
const SLOT_H = 44;
let spinning = false;

document.querySelectorAll('.row').forEach(row => {
  const group = row.dataset.group;
  row.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      row.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state[group] = chip.dataset.val;
    });
  });
});

function matches(a) {
  return (state.who === "any" || a.who === "any" || a.who === state.who)
      && (state.where === "any" || a.where === "any" || a.where === state.where)
      && (state.vibe === "any" || a.vibe === "any" || a.vibe === state.vibe);
}

function slotHTML(a) {
  return `<div class="slot"><span class="emoji">${a.e}</span>${a.t}</div>`;
}

function spin() {
  if (spinning) return;
  const pool = ACTIVITIES.filter(matches);
  if (pool.length === 0) {
    result.innerHTML = "No match — loosen a filter and try again.";
    return;
  }
  spinning = true;
  go.disabled = true;
  result.textContent = "Rolling…";

  const pick = pool[Math.floor(Math.random() * pool.length)];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    reel.style.transition = "none";
    reel.style.transform = "translateY(-22px)";
    reel.innerHTML = slotHTML(pick);
    reel.style.transform = `translateY(${(132 - SLOT_H)/2}px)`;
    finish(pick);
    return;
  }

  // build a long strip of random slots ending on the pick
  const strip = [];
  const spins = 34;
  for (let i = 0; i < spins; i++) strip.push(ACTIVITIES[Math.floor(Math.random()*ACTIVITIES.length)]);
  strip.push(pick);
  reel.innerHTML = strip.map(slotHTML).join('');

  const targetIndex = strip.length - 1;
  const center = (132 - SLOT_H) / 2;
  const y = -(targetIndex * SLOT_H) + center;

  reel.style.transition = "none";
  reel.style.transform = "translateY(0px)";
  reel.getBoundingClientRect(); // reflow
  reel.style.transition = "transform 2.6s cubic-bezier(0.15, 0.9, 0.2, 1)";
  reel.style.transform = `translateY(${y}px)`;

  reel.addEventListener('transitionend', () => finish(pick), { once: true });
}

function finish(pick) {
  spinning = false;
  go.disabled = false;
  go.textContent = "Spin again";
  result.innerHTML = `Go do it: <strong>${pick.t}</strong> ${pick.e}`;
}

go.addEventListener('click', spin);
</script>
</body>
</html>
